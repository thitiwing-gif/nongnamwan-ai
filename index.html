<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nongnamwan AI</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f5f5f5;
margin:0;
padding:30px;
}

.box{
max-width:420px;
margin:auto;
background:#fff;
padding:25px;
border-radius:20px;
box-shadow:0 10px 25px rgba(0,0,0,.15);
text-align:center;
}

h1{
color:#ff3f86;
}

select{
width:100%;
padding:15px;
font-size:18px;
border-radius:12px;
margin-top:20px;
}

button{
width:100%;
padding:16px;
margin-top:20px;
border:none;
border-radius:12px;
font-size:20px;
background:#ff3f86;
color:white;
cursor:pointer;
}

button:hover{
background:#ff1970;
}
</style>

</head>

<body>

<div class="box">

<h1>🎉 Nongnamwan AI</h1>

<h3>เลือก AI</h3>

<select id="ai">
  <option value="https://chat.openai.com">🤖 ChatGPT</option>
  <option value="https://gemini.google.com">✨ Gemini</option>
  <option value="https://claude.ai">🧠 Claude</option>
  <option value="https://grok.com">🚀 Grok</option>
  <option value="https://copilot.microsoft.com">💙 Copilot</option>
</select>

<br><br>

<button onclick="openAI()">🚀 เปิด AI</button>

<script>
function openAI(){
  const url=document.getElementById("ai").value;
  window.location.href=url;
}
</script>
